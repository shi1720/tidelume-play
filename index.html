<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
		<title>TIDELUME | Carry the light home</title>
		<style>
html,body{margin:0;padding:0;border:0;background:#071820;color:#e7eee8;height:100%;overflow:hidden;font-family:system-ui,sans-serif;touch-action:none}
#canvas{display:block;margin:0;padding:0;border:0;outline:none}
#status{position:fixed;inset:0;z-index:10;background:linear-gradient(90deg,rgba(7,24,32,.94),rgba(7,24,32,.45)),url('coast-painted.png') center/cover;display:flex;flex-direction:column;align-items:center;justify-content:center;visibility:visible;text-align:center;padding:24px}
#status-splash{width:84px;height:84px;object-fit:contain;margin-bottom:22px}
.wordmark{font-size:clamp(28px,5vw,52px);font-weight:400;letter-spacing:.26em;margin:0 0 14px .26em}
.tagline{color:#95afb2;font-size:17px;line-height:1.8;margin:0 0 30px}
#status-progress{width:min(360px,70vw);height:4px;border:0;border-radius:4px;accent-color:#f7c878;background:#193b45;overflow:hidden;display:block}
#status-progress::-webkit-progress-bar{background:#193b45}#status-progress::-webkit-progress-value{background:#f7c878}
#load-copy{font-size:13px;color:#95afb2;letter-spacing:.04em;margin-top:18px}
#status-notice{display:none;max-width:640px;border:1px solid #8f724b;padding:20px;line-height:1.6;background:#102b35;border-radius:12px}
#fs{position:fixed;right:10px;bottom:8px;z-index:5;background:#102b35;color:#95afb2;border:1px solid #385860;border-radius:6px;font-size:11px;padding:7px 10px;cursor:pointer;opacity:.65}
@media(max-width:640px){#fs{display:none}}
#retry{display:none;background:#f7c878;color:#102b35;border:0;border-radius:10px;padding:14px 24px;margin-top:20px;font:inherit;cursor:pointer}
#fs:hover,#fs:focus-visible{opacity:1;color:#e7eee8;outline:2px solid #f7c878}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="description" content="TIDELUME: Carry the light home. Twelve atmospheric light puzzles by Shivam Gupta.">
	<meta name="description" content="Carry a beam across twelve sleeping islands. A complete atmospheric puzzle game by Shivam Gupta. Play free in your browser.">
<meta name="theme-color" content="#071820">
</head>
	<body>
		<canvas id="canvas" tabindex="0" aria-label="Tidelume puzzle game. Use Tab to navigate controls. Arrow keys select mirrors, Enter rotates, T switches tide, Z undoes, Escape pauses.">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<button id="fs" type="button" aria-label="Toggle full screen">Full screen</button>
<div id="status" role="status" aria-live="polite">
			<img id="status-splash" src="lighthouse.svg" alt="">
<h1 class="wordmark">TIDELUME</h1><p class="tagline">Carry the light home.</p>
			<progress id="status-progress" aria-label="Loading game"></progress><p id="load-copy">Preparing the coast</p>
			<div id="status-notice"></div><button id="retry" type="button">Try again</button>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":3617148,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
document.getElementById('retry').addEventListener('click',()=>location.reload());
document.getElementById('fs').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){document.getElementById('fs').textContent='Full screen unavailable';}});

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
        document.getElementById('retry').style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice('The coast could not load. Check your connection, then try again.\n\n' + err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
                if (!initializing) return;
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
                    document.getElementById('load-copy').textContent = `Preparing the coast · ${Math.round(current / total * 100)}%`;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
